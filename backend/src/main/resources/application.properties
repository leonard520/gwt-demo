# =============================================================================
# GWT Demo Backend - Application Configuration
# Replaces legacy web.xml, applicationContext.xml, dispatcher-servlet.xml
# =============================================================================

# --- Server Configuration ---
server.port=8080

# --- Session Configuration ---
# 20-minute session timeout (matches source web.xml <session-timeout>20</session-timeout>)
server.servlet.session.timeout=20m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true

# --- Logging Configuration (SLF4J + Logback) ---
# Replaces legacy Log4j 1.2 configuration (log4j.properties)
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# --- CORS Configuration ---
# Required for React frontend (separate origin) to communicate with backend
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Jackson Configuration ---
# ISO-8601 date format for REST API JSON responses
spring.jackson.serialization.write-dates-as-timestamps=false
